name: flutter_project_one
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── File Picker ───────────────────────────────
  file_picker: ^8.1.2
  
  http: ^1.2.1    # ← ADD THIS for API calls
  pdf: ^3.11.1
  printing: ^5.13.1
  # ── Core ──────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Supabase (replaces all Firebase services) ─
  supabase_flutter: ^2.5.6      # Auth + Database + Realtime + Storage

  # ── Notifications ─────────────────────────────
  firebase_core: ^4.6.0         
  firebase_messaging: ^16.1.3   

  # ── State Management ──────────────────────────
  flutter_riverpod: ^3.3.1

  # ── Navigation ────────────────────────────────
  go_router: ^17.2.0

  # ── Environment Variables ─────────────────────
  flutter_dotenv: ^5.1.0

  # ── UI & Styling ──────────────────────────────
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.0.3   # color picker UI

  # ── Charts & Data Visualization ───────────────
  fl_chart: ^0.70.2

  # ── Utilities ─────────────────────────────────
  shimmer: ^3.0.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.jpg